<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36" />
      <stop offset="50%" stop-color="#0f051d" />
      <stop offset="100%" stop-color="#06010d" />
    </linearGradient>

    <linearGradient id="pinkNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff69b4" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="220" fill="url(#purpleGradient)" stroke="url(#pinkNeon)" stroke-width="6" filter="url(#neonGlow)" />
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#pinkNeon)" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.4" />

  <g filter="url(#neonGlow)">
    <path d="M 250 90 A 160 160 0 0 1 410 250" fill="none" stroke="url(#pinkNeon)" stroke-width="8" stroke-linecap="round" />
    <path d="M 250 410 A 160 160 0 0 1 90 250" fill="none" stroke="url(#pinkNeon)" stroke-width="8" stroke-linecap="round" />
  </g>

  <text x="250" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="115" font-weight="900" fill="url(#pinkNeon)" text-anchor="middle" letter-spacing="-2" filter="url(#neonGlow)">Ls</text>
</svg>


